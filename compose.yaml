name: hls-app
services:
  web:
    depends_on:
      mongo:
        condition: service_started
      mysql_db:
        condition: service_started
    container_name: "web"
    image: node:18-alpine
    command: sh -c "ls && npm install && npm run build && npx  prisma db push && npm start"
    ports:
      - 3081:3082
    environment:
      PORT: 3082
      DATABASE_URL: mongodb://mongo:27017/hsl_stream
    working_dir: /app
    volumes:
      - ../HLS:/app

  mongo:
    container_name: "mongo"
    image: mongo
    restart: always
    ports:
      - 27017:27017
#    environment:
#      MONGO_INITDB_ROOT_USERNAME: root
#      MONGO_INITDB_ROOT_PASSWORD: 123
#      MONGO_INITDB_DATABASE: hsl_stream

  mongo-express:
    container_name: "mongo-express"
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME:
      ME_CONFIG_MONGODB_ADMINPASSWORD:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: false
  mysql_db:
    container_name: "mysql"
    image: mysql
    restart: always
    ports:
      - 4000:3306
    environment:
      MYSQL_USER: din
      MYSQL_DATABASE: hls
      MYSQL_PORT: 3306,
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_PASSWORD: 123
